# The project's calls to the plugin's workflows, pinned to the same sha as the marketplace of
# .claude/settings.json: the check of an open pull request, and the close of the issue of a merged
# one. `edited` reruns the check when the body changes, so a **Setback** (es: **Retroceso**) added
# later is read.
name: trellis

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]

jobs:
  trellis:
    if: github.event.action != 'closed'
    uses: {{trellis.upstream}}/.github/workflows/consumer-check.yml@{{sha}}
    with:
      trellis-ref: {{sha}}
      trellis-repo: {{trellis.upstream}}
    permissions:
      contents: read
      pull-requests: write
  closed:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    uses: {{trellis.upstream}}/.github/workflows/consumer-closed.yml@{{sha}}
    with:
      trellis-ref: {{sha}}
      trellis-repo: {{trellis.upstream}}
    permissions:
      contents: read
      issues: write
      pull-requests: read

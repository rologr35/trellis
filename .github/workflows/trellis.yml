# The rules of trellis on its own pull requests, with the code of the branch and read permission only,
# so without the protected head of consumer-check.yml, which writes in the pull request; and the close
# of the issue of a merged one.

name: trellis

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # The ratchet compares with the base over the full history, and the secret scan reads it all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pull request body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: hygiene
        run: bash bin/trellis hygiene
      - name: pr-check
        run: bash bin/trellis pr-check --body "$RUNNER_TEMP/pr-body.md"
      - name: ratchet
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if bash bin/trellis pr-check --has-setback --body "$RUNNER_TEMP/pr-body.md"; then
            bash bin/trellis ratchet --base "origin/$BASE" --allow-loosen
          else
            bash bin/trellis ratchet --base "origin/$BASE"
          fi
      - name: secret scan
        run: bash scripts/secret-scan-ci.sh

  closed:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    uses: ./.github/workflows/consumer-closed.yml
    with:
      trellis-ref: ${{ github.event.pull_request.merge_commit_sha }}
      trellis-repo: ${{ github.repository }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
